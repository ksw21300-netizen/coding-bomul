<!doctype html>
<html lang="ko">

<title>회사 정보 · 우후 컴퍼니</title>
<style>
:root{
  --bg:#FBFAF7; --fg:#1F2328; --muted:#5D666F; --line:#E2DFD8;
  --accent:#5B3E9B; --panel:#F4F2EC;
  --f-ui:"Pretendard","IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181C; --fg:#E7E4DE; --muted:#9BA5AE; --line:#2C343B;
         --accent:#9B82E0; --panel:#1B2127; color-scheme:dark }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  line-height:1.72;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:44px 64px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:8px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--accent);margin:0 0 7px}
h1{font-size:25px;margin:0 0 10px;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--muted);margin:0}
h2{font-size:17px;margin:36px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:600;font-size:13px;width:40%}
td{font-variant-numeric:tabular-nums}
@media (max-width:420px){ th{width:46%;font-size:12.5px} th,td{padding:9px 10px} }
</style>
</head>
